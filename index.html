<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="theme-color" content="#1f6b5a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Accedi · AGENDA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/index.css?v=login" />
  </head>
  <body>
    <main class="schermo">
      <section class="card" aria-labelledby="titolo-app">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="48" height="48">
            <rect x="6" y="10" width="36" height="32" rx="8" fill="#1f6b5a" />
            <rect x="6" y="10" width="36" height="10" rx="4" fill="#2f8f78" />
            <rect x="14" y="6" width="4" height="10" rx="2" fill="#e07a3d" />
            <rect x="30" y="6" width="4" height="10" rx="2" fill="#e07a3d" />
            <rect x="14" y="26" width="8" height="8" rx="2" fill="#f4f1ea" />
            <rect x="26" y="26" width="8" height="8" rx="2" fill="#f4f1ea" />
          </svg>
        </div>
        <h1 id="titolo-app">AGENDA</h1>
        <p class="sottotitolo" id="sottotitolo" hidden></p>

        <form id="form-auth" novalidate>
          <label class="campo">
            <span>Email</span>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              required
              placeholder="esempio@email.com"
            />
          </label>

          <label class="campo">
            <span>Password</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              minlength="6"
              placeholder="almeno 6 caratteri"
            />
          </label>
          <label class="opzione-password">
            <input id="vedi-password" type="checkbox" />
            <span>Mostra password</span>
          </label>

          <p id="messaggio" class="messaggio" role="status" hidden></p>

          <button id="bottone-invia" class="bottone-principale" type="submit">
            Accedi
          </button>
        </form>

        <form id="form-nuova-password" hidden>
          <label class="campo">
            <span>Nuova password</span>
            <input
              id="nuova-password"
              name="nuova-password"
              type="password"
              autocomplete="new-password"
              required
              minlength="6"
              placeholder="almeno 6 caratteri"
            />
          </label>
          <label class="campo">
            <span>Ripeti password</span>
            <input
              id="ripeti-password"
              name="ripeti-password"
              type="password"
              autocomplete="new-password"
              required
              minlength="6"
              placeholder="ripeti la stessa password"
            />
          </label>
          <label class="opzione-password">
            <input id="vedi-password-recupero" type="checkbox" />
            <span>Mostra password</span>
          </label>
          <p id="messaggio-recupero" class="messaggio" role="status" hidden></p>
          <button id="bottone-salva-password" class="bottone-principale" type="submit">
            Salva nuova password
          </button>
        </form>

        <p class="cambio-modo" id="blocco-cambio">
          <span id="testo-cambio">Non hai un account?</span>
          <button id="bottone-cambio" class="link" type="button">Registrati</button>
        </p>
        <p class="cambio-modo" id="blocco-recupero">
          <button id="bottone-recupero" class="link" type="button">Password dimenticata?</button>
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/index.js?v=login"></script>
  </body>
</html>
