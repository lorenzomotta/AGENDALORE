<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="theme-color" content="#1e4d28" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Agenda · AgendaLore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/agenda.css?v=pagamento-label" />
  </head>
  <body>
    <header class="barra-superiore">
      <button class="bottone-vista" type="button" data-vista="cerca">Cerca</button>
      <button class="bottone-vista" type="button" data-vista="mese">Mese</button>
      <button class="bottone-vista" type="button" data-vista="settimana">Settimana</button>
      <button class="bottone-vista attivo" type="button" data-vista="giorno" aria-pressed="true">
        Giorno
      </button>
    </header>

    <p class="riga-utente">
      <span id="email-utente">...</span>
      <a class="link-dati" id="link-dati" href="dati.html">Dati</a>
    </p>
    <script>
      document.getElementById("link-dati").onclick = function () {
        window.location.href = "dati.html";
        return false;
      };
    </script>

    <main class="contenuto">
      <section class="scheda-agenda">
        <label id="blocco-cerca" class="campo-ricerca" hidden>
          <span class="sr-only">Cerca appuntamenti</span>
          <input
            id="campo-ricerca"
            type="search"
            placeholder="Cerca in tutti i campi"
            autocomplete="off"
          />
        </label>

        <div id="blocco-calendario">
          <h1 id="etichetta-periodo" class="etichetta-periodo" title="Tocca per scegliere una data"></h1>
          <label class="campo-data">
            <span class="sr-only">Seleziona data</span>
            <input id="filtro-data" type="date" />
          </label>

          <div class="barre-navigazione" aria-label="Spostamento date">
            <button id="bottone-indietro" class="bottone-nav" type="button" aria-label="Indietro">‹</button>
            <button id="bottone-oggi" type="button">Oggi</button>
            <button id="bottone-avanti" class="bottone-nav" type="button" aria-label="Avanti">›</button>
          </div>

          <p id="etichetta-giorno" class="barra-giorno"></p>
        </div>
        <p id="stato" class="stato" role="status"></p>
        <div id="area-vista" class="area-lista"></div>
      </section>
    </main>

    <footer class="barra-inferiore">
      <button id="bottone-esci" class="bottone-esci" type="button">Esci</button>
      <button id="bottone-nuovo" class="bottone-aggiungi" type="button">Aggiungi</button>
    </footer>

    <dialog id="dialogo-dettaglio" class="dialogo dialogo-con-footer">
      <div class="dialogo-corpo">
        <div class="dettaglio-testata">
          <p id="dettaglio-quando"></p>
          <p id="dettaglio-visibilita"></p>
        </div>
        <p id="riga-dettaglio-importo" class="riga-dettaglio" hidden>
          <span class="etichetta-dettaglio">Importo:</span>
          <span id="dettaglio-importo"></span>
        </p>
        <p id="riga-dettaglio-stato-pagamento" class="riga-dettaglio" hidden>
          <span class="etichetta-dettaglio">Stato pagamento:</span>
          <span id="dettaglio-stato-pagamento"></span>
        </p>
        <p id="dettaglio-tipo" class="dettaglio-tipo"></p>
        <p class="riga-dettaglio">
          <span class="etichetta-dettaglio">Oggetto:</span>
          <span id="dettaglio-titolo"></span>
        </p>
        <p class="riga-dettaglio">
          <span class="etichetta-dettaglio">Interlocutore:</span>
          <span id="dettaglio-interlocutore"></span>
        </p>
        <p class="riga-dettaglio">
          <span class="etichetta-dettaglio">Esecutore:</span>
          <span id="dettaglio-esecutore"></span>
        </p>
        <p class="riga-dettaglio">
          <span class="etichetta-dettaglio">Note:</span>
          <span id="dettaglio-note"></span>
        </p>
        <p class="riga-dettaglio">
          <span class="etichetta-dettaglio">Telefono:</span>
          <span id="dettaglio-telefono"></span>
        </p>
        <p class="riga-dettaglio">
          <span class="etichetta-dettaglio">Email:</span>
          <span id="dettaglio-email"></span>
        </p>
      </div>
      <div class="dialogo-footer">
        <div id="dettaglio-azioni" class="azioni-dialogo azioni-dettaglio">
          <button id="dettaglio-cancella" class="bottone-pericolo" type="button">Cancella</button>
          <button id="dettaglio-duplica" class="bottone-secondario" type="button">Duplica</button>
          <button id="dettaglio-modifica" class="bottone-principale" type="button">Modifica</button>
        </div>
        <button id="dettaglio-chiudi" class="bottone-secondario bottone-chiudi" type="button">Chiudi</button>
      </div>
    </dialog>

    <dialog id="dialogo" class="dialogo dialogo-con-footer">
      <form id="form-appuntamento">
        <h2 id="titolo-dialogo">Nuovo appuntamento</h2>
        <div class="dialogo-corpo">
          <input id="id-appuntamento" type="hidden" />
          <div class="campo riga-tipo-pagamento">
            <div class="riga-etichette-tipo">
              <label for="tipo-appuntamento">Tipo appuntamento</label>
              <label for="pagamento">Pagamento</label>
            </div>
            <div class="riga-input-tipo">
              <div class="combo">
                <input
                  id="tipo-appuntamento"
                  name="tipo-appuntamento"
                  type="text"
                  required
                  maxlength="80"
                  autocomplete="off"
                  placeholder="Tocca per scegliere, oppure scrivi un nome nuovo"
                />
                <ul id="lista-tipo-appuntamento" class="combo-lista" hidden></ul>
              </div>
              <input id="pagamento" name="pagamento" type="checkbox" />
            </div>
          </div>
          <div id="blocco-pagamento" hidden>
            <label class="campo">
              <span>Importo</span>
              <input
                id="importo"
                name="importo"
                type="number"
                step="0.01"
                min="0"
                inputmode="decimal"
                placeholder="Es. 50"
              />
            </label>
            <label class="campo">
              <span>Stato pagamento</span>
              <select id="stato-pagamento" name="stato-pagamento">
                <option value="PAGARE">PAGARE</option>
                <option value="PAGATO">PAGATO</option>
              </select>
            </label>
          </div>
          <label class="campo">
            <span>Titolo</span>
            <input id="titolo" name="titolo" type="text" required maxlength="80" placeholder="Es. Dentista" />
          </label>
          <label class="campo">
            <span>Interlocutore (facoltativo)</span>
            <div class="combo">
              <input
                id="interlocutore"
                name="interlocutore"
                type="text"
                maxlength="80"
                autocomplete="off"
                placeholder="Tocca per scegliere, oppure scrivi un nome nuovo"
              />
              <ul id="lista-interlocutore" class="combo-lista" hidden></ul>
            </div>
          </label>
          <label class="campo">
            <span>Data</span>
            <input id="data" name="data" type="date" required />
          </label>
          <label class="campo">
            <span>Ora (facoltativa)</span>
            <input id="ora" name="ora" type="time" />
          </label>
          <label class="campo">
            <span>Esecutore (facoltativo)</span>
            <div class="combo">
              <input
                id="esecutore"
                name="esecutore"
                type="text"
                maxlength="80"
                autocomplete="off"
                placeholder="Tocca per scegliere, oppure scrivi un nome nuovo"
              />
              <ul id="lista-esecutore" class="combo-lista" hidden></ul>
            </div>
          </label>
          <label class="campo">
            <span>Note (facoltative)</span>
            <textarea id="note" name="note" rows="3" placeholder="Dettagli utili"></textarea>
          </label>
          <label class="campo">
            <span>Telefono (facoltativo)</span>
            <input id="telefono" name="telefono" type="tel" maxlength="40" placeholder="Es. 333 1234567" />
          </label>
          <label class="campo">
            <span>Email (facoltativa)</span>
            <input id="email-appuntamento" name="email-appuntamento" type="text" maxlength="120" placeholder="Es.  mario@email.com" />
          </label>
          <label class="campo campo-check">
            <input id="tutti" name="tutti" type="checkbox" />
            <span>Tutti (visibile a ogni utente dell’app)</span>
          </label>
          <p id="errore-form" class="messaggio errore" hidden></p>
        </div>
        <div class="dialogo-footer">
          <div class="azioni-dialogo">
            <button id="bottone-annulla" class="bottone-secondario" type="button">Annulla</button>
            <button id="bottone-salva" class="bottone-principale" type="submit">Salva</button>
          </div>
        </div>
      </form>
    </dialog>

    <dialog id="dialogo-cancella" class="dialogo">
      <p class="domanda-tutti">Vuoi cancellare questo appuntamento?</p>
      <div class="azioni-dialogo">
        <button id="cancella-no" class="bottone-secondario" type="button">NO</button>
        <button id="cancella-si" class="bottone-pericolo" type="button">SÌ</button>
      </div>
    </dialog>

    <dialog id="dialogo-tutti" class="dialogo">
      <p class="domanda-tutti">Vuoi renderlo visibile a tutti?</p>
      <div class="azioni-dialogo">
        <button id="tutti-no" class="bottone-secondario" type="button">NO</button>
        <button id="tutti-si" class="bottone-principale" type="button">SÌ</button>
      </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/agenda.js?v=pagamento"></script>
  </body>
</html>
